<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultBox – Back up photos, files and contacts</title>
<style>
:root{--bg:#EEF6FF;--surface:#fff;--ink:#0F2540;--muted:#566A85;--blue:#1F6FEB;--teal:#12B5A6;--line:#D3E2F5;--bar:#E1ECFA}
@media (prefers-color-scheme:dark){:root{--bg:#0A1628;--surface:#12233D;--ink:#EAF2FF;--muted:#9DB2CF;--line:#243B5E;--bar:#1B3050}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 40px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:700;font-size:21px}
nav span{color:var(--blue)}
.btn{border:0;cursor:pointer;font:600 16px system-ui,sans-serif;padding:13px 22px;border-radius:12px;background:var(--blue);color:#fff}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:14px}
:is(button,input):focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1{font-size:clamp(32px,7vw,52px);line-height:1.1;margin:20px 0 12px}
.sub{color:var(--muted);font-size:18px;margin:0 0 22px;max-width:46ch}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}
.meter{height:12px;background:var(--bar);border-radius:99px;overflow:hidden;margin:6px 0}
.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .4s}
.small{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 15px system-ui;cursor:pointer}
.tab[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.drop{display:block;text-align:center;border:2px dashed var(--line);border-radius:18px;padding:26px 14px;cursor:pointer;margin:0 0 14px;font-weight:600}
.drop input{display:none}.drop:focus-within{outline:3px solid var(--teal)}
ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;word-break:break-word}
.rt{display:flex;gap:8px;align-items:center;flex-shrink:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.th{position:relative}.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.th button{position:absolute;right:4px;bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=text],input[type=tel]{flex:1 1 140px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<nav><div>Vault<span>Box</span></div><button class="btn alt sm" id="out" hidden>Sign out</button></nav>

<main id="login">
<h1>One safe place for your photos, files and contacts.</h1>
<p class="sub">Sign in with your Google account to open your backup. Your data is private to you.</p>
<button class="btn" id="g">Continue with Google</button>
<p class="small" id="lm" role="status"></p>
</main>

<main id="app" hidden>
<div class="card">
<div class="small" id="who"></div>
<div class="small"><b id="used">0 MB</b> backed up</div>
<div class="meter" aria-hidden="true"><div id="bar"></div></div>
</div>
<div class="tabs" role="tablist">
<button class="tab" role="tab" aria-selected="true" data-t="photos">Photos</button>
<button class="tab" role="tab" aria-selected="false" data-t="files">Files</button>
<button class="tab" role="tab" aria-selected="false" data-t="contacts">Contacts</button>
</div>
<p class="small" id="st" role="status"></p>

<section id="photos" class="card">
<label class="drop"><input type="file" id="pi" accept="image/*" multiple>Choose photos to back up</label>
<div class="thumbs" id="pl"></div><p class="small" id="pe">No photos yet.</p>
</section>

<section id="files" class="card" hidden>
<label class="drop"><input type="file" id="fi" multiple>Choose files to back up</label>
<ul id="fl"></ul><p class="small" id="fe">No files yet.</p>
</section>

<section id="contacts" class="card" hidden>
<div class="row"><input type="text" id="cn" placeholder="Name" aria-label="Name"><input type="tel" id="cp" placeholder="Phone number" aria-label="Phone number"><button class="btn" id="ca">Add</button></div>
<div class="row">
<label class="btn alt sm" style="cursor:pointer">Import .vcf<input type="file" id="vi" accept=".vcf,text/vcard" hidden></label>
<button class="btn alt sm" id="ex">Export .csv</button>
</div>
<ul id="cl"></ul><p class="small" id="ce">No contacts yet.</p>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1. Paste your own project values from Supabase: Project Settings > API
var SUPABASE_URL='https://kxwdpxjftjunmalmkqay.supabase.co';
var SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4d2RweGpmdGp1bm1hbG1rcWF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2ODExNzIsImV4cCI6MjExMDI1NzE3Mn0.oBlyk23bfXXi32y-u9bCBQvrK8AbiIhrOuAWZQ_D_fA';
var BUCKET='backups';

function $(i){return document.getElementById(i)}
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fmt(b){return b>1073741824?(b/1073741824).toFixed(2)+' GB':b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
function status(t){$('st').textContent=t}
var sb=null,uid=null,total=0;

if(SUPABASE_URL.indexOf('PASTE')===0){
$('lm').textContent='Setup needed: add your Supabase URL and key at the top of this file.';
$('g').disabled=true;
}else{
sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
sb.auth.onAuthStateChange(function(ev,session){show(session)});
sb.auth.getSession().then(function(r){show(r.data.session)});
}

function show(session){
var on=!!session;
$('login').hidden=on;$('app').hidden=!on;$('out').hidden=!on;
if(on&&uid!==session.user.id){
uid=session.user.id;
$('who').textContent='Signed in as '+(session.user.email||'your account');
loadFiles();loadContacts();
}
if(!on){uid=null}
}
$('g').onclick=function(){
sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
};
$('out').onclick=function(){sb.auth.signOut()};

document.querySelectorAll('.tab').forEach(function(t){
t.onclick=function(){
document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x===t)});
['photos','files','contacts'].forEach(function(id){$(id).hidden=id!==t.dataset.t});
};});

function clean(n){return n.replace(/^\d+-/,'')}
async function loadFiles(){
var r=await sb.storage.from(BUCKET).list(uid,{limit:1000,sortBy:{column:'created_at',order:'desc'}});
if(r.error){status('Could not load files: '+r.error.message);return}
var all=r.data.filter(function(x){return x.name!=='.emptyFolderPlaceholder'});
total=all.reduce(function(a,x){return a+((x.metadata&&x.metadata.size)||0)},0);
$('used').textContent=fmt(total);
$('bar').style.width=Math.min(100,Math.max(total?1:0,total/(1024*1024*1024)*100))+'%';
var isImg=function(x){return x.metadata&&/^image\//.test(x.metadata.mimetype||'')};
var photos=all.filter(isImg),files=all.filter(function(x){return !isImg(x)});
$('pl').textContent='';$('fl').textContent='';
$('pe').hidden=photos.length>0;$('fe').hidden=files.length>0;
var s=photos.length?await sb.storage.from(BUCKET).createSignedUrls(photos.map(function(x){return uid+'/'+x.name}),3600):{data:[]};
photos.forEach(function(x,i){
var w=mk('div','th'),im=document.createElement('img');
im.alt=clean(x.name);im.loading='lazy';if(s.data&&s.data[i])im.src=s.data[i].signedUrl;
var d=mk('button','btn alt sm','Delete');d.onclick=function(){rm(x.name)};
w.appendChild(im);w.appendChild(d);$('pl').appendChild(w);
});
files.forEach(function(x){
var li=mk('li'),n=mk('span',null,'📄 '+clean(x.name)),g=mk('span','rt');
g.appendChild(mk('span','small',fmt((x.metadata&&x.metadata.size)||0)));
var o=mk('button','btn alt sm','Download');o.onclick=async function(){
var u=await sb.storage.from(BUCKET).createSignedUrl(uid+'/'+x.name,60,{download:clean(x.name)});
if(u.data)location.href=u.data.signedUrl;
};
var d=mk('button','btn alt sm','Delete');d.onclick=function(){rm(x.name)};
g.appendChild(o);g.appendChild(d);li.appendChild(n);li.appendChild(g);$('fl').appendChild(li);
});
}
async function rm(name){
var r=await sb.storage.from(BUCKET).remove([uid+'/'+name]);
status(r.error?'Could not delete: '+r.error.message:'Deleted.');loadFiles();
}
async function upload(list){
for(var f of Array.from(list)){
status('Saving '+f.name+'…');
var path=uid+'/'+Date.now()+'-'+f.name.replace(/[^\w.\-]/g,'_');
var r=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||undefined});
if(r.error){status('Could not save '+f.name+': '+r.error.message);return}
}
status('Saved to your backup.');loadFiles();
}
$('pi').onchange=function(e){upload(e.target.files);e.target.value=''};
$('fi').onchange=function(e){upload(e.target.files);e.target.value=''};

var contacts=[];
async function loadContacts(){
var r=await sb.from('contacts').select('id,name,phone').order('name');
if(r.error){status('Could not load contacts: '+r.error.message);return}
contacts=r.data;$('cl').textContent='';$('ce').hidden=contacts.length>0;
contacts.forEach(function(c){
var li=mk('li'),g=mk('span','rt');
var d=mk('button','btn alt sm','Delete');d.onclick=async function(){await sb.from('contacts').delete().eq('id',c.id);loadContacts()};
g.appendChild(mk('span','small',c.phone));g.appendChild(d);
li.appendChild(mk('span',null,'👤 '+c.name));li.appendChild(g);$('cl').appendChild(li);
});
}
async function addContacts(rows){
var r=await sb.from('contacts').insert(rows.map(function(x){return{user_id:uid,name:x.name,phone:x.phone}}));
status(r.error?'Could not save contacts: '+r.error.message:'Saved '+rows.length+' contact'+(rows.length>1?'s':'')+'.');loadContacts();
}
$('ca').onclick=function(){
var n=$('cn').value.trim(),p=$('cp').value.trim();if(!n||!p)return;
addContacts([{name:n,phone:p}]);$('cn').value='';$('cp').value='';
};
$('vi').onchange=function(e){
var f=e.target.files[0];if(!f)return;
f.text().then(function(t){
var rows=[];
t.split(/BEGIN:VCARD/i).slice(1).forEach(function(c){
var n=(c.match(/^FN[^:]*:(.+)$/mi)||[])[1],p=(c.match(/^TEL[^:]*:(.+)$/mi)||[])[1];
if(n&&p)rows.push({name:n.trim(),phone:p.trim()});
});
if(rows.length)addContacts(rows);else status('No contacts with a name and number found in that file.');
});
e.target.value='';
};
$('ex').onclick=function(){
var csv='Name,Phone\n'+contacts.map(function(c){return '"'+c.name.replace(/"/g,'""')+'","'+c.phone.replace(/"/g,'""')+'"'}).join('\n');
var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='contacts.csv';a.click();
};
</script>
</body>
</html>
